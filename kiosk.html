<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="only light" />
  <!-- 아이패드 홈 화면 추가(테넷 키오스크, 2026-09-09): 앱 manifest 를 쓰지 않아야 start_url(회원앱)로 열리지 않고
       추가한 그 주소(?site=tenet&cardpay=1)로 전체화면 실행된다. manifest 링크는 vite.config 의 kiosk-no-manifest 플러그인이 제거 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="키오스크" />
  <link rel="apple-touch-icon" href="/mimm-app/apple-touch-icon.png" />
  <!-- 키오스크 전용 manifest 를 실행 시점에 붙인다 (2026-09-09): 아이패드는 홈 화면 추가 때 페이지의 manifest start_url 로 앱을 만들므로
       테넷(?site=tenet)이면 kiosk-tenet.webmanifest(start_url kiosk.html?site=tenet&cardpay=1), 아니면 kiosk.webmanifest. 회원앱 manifest 는 쓰지 않음 -->
  <script>(function(){var t=/[?&]site=tenet(&|$)/.test(location.search)||(function(){try{return localStorage.getItem('mimm_site')==='tenet'}catch(e){return false}})();var l=document.createElement('link');l.rel='manifest';l.href=t?'kiosk-tenet.webmanifest':'kiosk.webmanifest';document.head.appendChild(l);})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <title>MIMM 키오스크</title>
  <script type="module" crossorigin src="/mimm-app/assets/kiosk-BYpYZ8Ce.js"></script>
  <link rel="modulepreload" crossorigin href="/mimm-app/assets/pricing-BG6PSdno.js">
  <link rel="stylesheet" crossorigin href="/mimm-app/assets/kiosk-C7cQ4AUn.css"><script id="vite-plugin-pwa:register-sw" src="/mimm-app/registerSW.js"></script></head>
<body>
  <div id="root"></div>
</body>
</html>
